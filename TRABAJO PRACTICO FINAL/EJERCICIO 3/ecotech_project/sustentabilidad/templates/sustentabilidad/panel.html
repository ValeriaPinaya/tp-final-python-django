<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Sustentabilidad - EcoTech</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 35px;
        }

        h1 {
            color: #2e7d32;
            font-size: 26px;
            border-bottom: 2px solid #a5d6a7;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }

        h2 {
            color: #388e3c;
            font-size: 18px;
            margin-top: 25px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .metric-card {
            background-color: #e8f5e9;
            border-left: 5px solid #4caf50;
            border-radius: 8px;
            padding: 15px;
        }

        .metric-card label {
            font-size: 12px;
            color: #558b2f;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .metric-card span {
            font-size: 20px;
            font-weight: 600;
            color: #1b5e20;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }

        .history-item span.plant-name {
            font-weight: 600;
            color: #424242;
        }

        .history-item span.consumption {
            background-color: #e0f2f1;
            color: #00695c;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Panel de Control de Sustentabilidad</h1>
        
        <h2>Métricas Globales</h2>
        <div class="metrics-grid">
            <div class="metric-card">
                <label>Emisiones Totales</label>
                <span>{{ metricas.total_emisiones }} kg CO2</span>
            </div>
            <div class="metric-card">
                <label>Planta Mayor Consumo</label>
                <span>{{ metricas.planta_mayor_consumo }}</span>
            </div>
        </div>

        <h2>Historial por Planta</h2>
        <ul class="history-list">
            {% for reg in registros %}
                <li class="history-item">
                    <span class="plant-name">{{ reg.planta }}</span>
                    <span class="consumption">{{ reg.consumo }} kWh</span>
                </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
